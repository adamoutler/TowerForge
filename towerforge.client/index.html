<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name='impact-site-verification' content='577bcf16-b791-4a99-b354-5bd2ce5b7acd'>
    <!-- impact.com's tracking script was removed 2026-11-08 (privacy laws); it's kept in ops/impact/ with how to put it back. The meta tag above only verifies the site. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0812" />
    <!-- Installable as an app (public/manifest.webmanifest; icons: scripts/app-icons.ps1). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TowerForge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The player's theme (components/common/ThemePicker.tsx) before the page paints. -->
    <script>try { var t = localStorage.getItem('tc_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { }</script>
    <title>TowerForge — The Tower Companion</title>
    <meta name="description" content="Companion for The Tower (idle tower defense): import your account and see what to upgrade next, ranked by the waves and coins each upgrade gives for what it costs." />
    <link rel="canonical" href="https://towerforge.net/" />
    <!-- Link previews (Discord, Reddit, X…). The image: scripts/og-image.ps1. Each page gets its own title and description at build (routePagesPlugin.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TowerForge" />
    <meta property="og:title" content="TowerForge — The Tower Companion" />
    <meta property="og:description" content="Import your account and see what to upgrade next, ranked by the waves and coins each upgrade gives for what it costs. Optimizer, What If, Tournaments, Modules and Bots." />
    <meta property="og:url" content="https://towerforge.net/" />
    <meta property="og:image" content="https://towerforge.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TowerForge, companion for The Tower: Optimizer, What If, Tournaments, Modules and Bots" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TowerForge — The Tower Companion" />
    <meta name="twitter:description" content="Import your account and see what to upgrade next, ranked by the waves and coins each upgrade gives for what it costs." />
    <meta name="twitter:image" content="https://towerforge.net/og-image.png" />
    <!-- Umami analytics (self-hosted at /analytics, cookieless). Only reports from towerforge.net, and not from browsers that send Do Not Track (the Privacy page says so). -->
    <script defer src="/analytics/script.js" data-website-id="06a68bc5-23dd-40b8-9f3f-7fa542b9ceca" data-domains="towerforge.net,www.towerforge.net" data-do-not-track="true"></script>
</head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
