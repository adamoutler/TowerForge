services:
  towerforge-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: towerforge-dev:latest
    container_name: towerforge-dev
    working_dir: /workspace
    network_mode: "host"
    restart: unless-stopped
    environment:
      DEV_SERVER_PORT: "8097"
      ADB_SERVER_SOCKET: "tcp:127.0.0.1:5037"
    command: ["sh", "-c", "cd /workspace/towerforge.client && if [ ! -d node_modules ]; then npm ci; fi && exec npm run dev -- --host 0.0.0.0 --port 8097"]
    volumes:
      - .:/workspace
      - /dev/bus/usb:/dev/bus/usb
