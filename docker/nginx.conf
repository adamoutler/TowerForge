# ============================================================
# TowerForge — Hardened Production Nginx Configuration
# Requirement Traceability: REQ-SEC-012, REQ-SEC-013, REQ-INFRA-001
# ============================================================

types {
    application/vnd.android.package-archive apk;
}

server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;
    send_timeout 10s;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Block access to any hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Hardened origin security headers (inherited by locations that do not define add_header)
    add_header Permissions-Policy "usb=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:47821 http://127.0.0.1:47821 ws://localhost:47821 ws://127.0.0.1:47821; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;

    # Plain-text single-file Python companion download — force attachment and repeat all security headers
    location = /downloads/towerforge-link.py {
        types {}
        default_type text/x-python;
        charset utf-8;
        add_header Content-Disposition "attachment; filename=\"towerforge-link.py\"" always;
        add_header Permissions-Policy "usb=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:47821 http://127.0.0.1:47821 ws://localhost:47821 ws://127.0.0.1:47821; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Python companion zipapp download — force attachment and repeat all security headers
    location = /downloads/towerforge-link.pyz {
        types {}
        default_type application/octet-stream;
        add_header Content-Disposition "attachment; filename=\"towerforge-link.pyz\"" always;
        add_header Permissions-Policy "usb=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:47821 http://127.0.0.1:47821 ws://localhost:47821 ws://127.0.0.1:47821; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Android companion APK download — force attachment and repeat all security headers
    location = /downloads/TowerForgeLink.apk {
        types {}
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=\"TowerForgeLink.apk\"" always;
        add_header Permissions-Policy "usb=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:47821 http://127.0.0.1:47821 ws://localhost:47821 ws://127.0.0.1:47821; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Catch-all for /downloads/ — never fall back to SPA /index.html when a download is missing
    location ^~ /downloads/ {
        add_header Permissions-Policy "usb=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:47821 http://127.0.0.1:47821 ws://localhost:47821 ws://127.0.0.1:47821; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Linux systemd uaccess udev rule download — force attachment and repeat all security headers
    location = /linux/51-android-adb-uaccess.rules {
        default_type text/plain;
        add_header Content-Disposition "attachment; filename=\"51-android-adb-uaccess.rules\"" always;
        add_header Permissions-Policy "usb=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:47821 http://127.0.0.1:47821 ws://localhost:47821 ws://127.0.0.1:47821; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Immutable content-hashed Vite assets — repeat all security headers alongside Cache-Control
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Permissions-Policy "usb=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:47821 http://127.0.0.1:47821 ws://localhost:47821 ws://127.0.0.1:47821; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # SPA fallback (inherits server-level security headers)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
