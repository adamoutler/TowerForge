services:
  towerforge-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: towerforge-web:latest
    container_name: towerforge-web
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=101,mode=0755
    pids_limit: 64
    mem_limit: 128m
    cpus: 1.0
    ports:
      - "8096:80"
